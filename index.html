<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário da Larissa 🦋</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf2f8;--card:#fff;--ink:#4a1d5c;--mut:#8b6a9a;--pk:#ec4899;--lc:#c4b5fd;--pp:#7c3aed;--ln:#f3d9f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f29;--card:#2a1a3a;--ink:#f6e8ff;--mut:#b9a0cc;--ln:#44295a;--lc:#6d4fb3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d0f29;--card:#2a1a3a;--ink:#f6e8ff;--mut:#b9a0cc;--ln:#44295a;--lc:#6d4fb3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Quicksand","Segoe UI",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.deco{position:fixed;pointer-events:none;opacity:.18;font-size:64px;z-index:0}
.d1{right:-8px;bottom:70px}.d2{left:-10px;bottom:10px;font-size:80px}.d3{right:12px;top:120px;font-size:44px;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translate(-14px,10px) rotate(8deg)}}
header{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;padding:18px 16px 14px;border-radius:0 0 28px 28px;position:relative;z-index:1}
header h1{margin:0;font:700 22px "Georgia",serif}header p{margin:2px 0 0;opacity:.9;font-size:13px}
header .bf{position:absolute;right:16px;top:12px;font-size:34px;animation:fl 5s ease-in-out infinite}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px;position:relative;z-index:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(124,58,237,.08)}
.card h2{margin:0 0 8px;font:700 17px Georgia,serif;color:var(--pp)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h2{color:var(--lc)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:linear-gradient(160deg,var(--bg),var(--card));border:1px solid var(--ln);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--pk)}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--pp));border-radius:99px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--pk),var(--pp));color:#fff;font:inherit;font-weight:700;cursor:pointer}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
.list>div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--ln);font-size:14px}
.mut{color:var(--mut);font-size:13px}.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}.chk input{width:22px;height:22px;accent-color:var(--pk)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
ul.pl{padding-left:18px;margin:6px 0}svg text{fill:var(--mut);font-size:9px}
</style>
</head>
<body>
<div class="deco d1">🌸</div><div class="deco d2">🌿</div><div class="deco d3">🦋</div>
<header><span class="bf">🦋</span><h1>🌷 Diário da Larissa</h1><p id="hello">Cada passo conta. Floresça no seu ritmo 🌸</p></header>
<main><nav id="nav"></nav><div id="view"></div>
<p class="mut" style="text-align:center">🍃 Seus dados ficam salvos neste aparelho. Este app não substitui acompanhamento médico e nutricional.</p></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const T=iso(),br=d=>d.slice(8)+'/'+d.slice(5,7),n1=x=>(Math.round(x*10)/10).toLocaleString('pt-BR');
const ACT={'Caminhada leve':3.3,'Caminhada rápida':4.5,'Corrida leve':8,'Bicicleta':6.8,'Musculação':5,'Hidroginástica':5.5,'Natação':6,'Dança / Zumba':6.5,'Yoga / Pilates':3,'Escada':8.8,'Bicicleta ergométrica':7,'Elíptico':5};
const FOODS={'Arroz branco (100 g)':[130,2.5,28,.3],'Feijão (100 g)':[77,4.5,14,.5],'Frango grelhado (100 g)':[165,31,0,3.6],'Ovo cozido (1 un)':[70,6,.5,5],'Banana (1 un)':[90,1,23,.3],'Maçã (1 un)':[70,.4,19,.2],'Aveia (30 g)':[115,4,20,2.2],'Pão integral (1 fatia)':[65,3,12,1],'Iogurte natural (170 g)':[100,6,8,5],'Salada crua (100 g)':[20,1.5,4,.2],'Batata-doce (100 g)':[86,1.6,20,.1],'Peixe assado (100 g)':[130,26,0,3],'Azeite (1 colher)':[90,0,0,10],'Patinho moído (100 g)':[170,27,0,7],'Tilápia grelhada (100 g)':[128,26,0,2.7],'Lombo suíno (100 g)':[190,27,0,8],'Ovos mexidos (3 un)':[230,19,1.5,16],'Clara de ovo (1 un)':[17,3.6,.2,0],'Omelete (2 ovos + 2 claras)':[205,20,1,12],'Queijo cottage (30 g)':[28,3.5,1,1],'Queijo minas frescal (30 g)':[80,5,1,6],'Leite desnatado (200 ml)':[70,7,10,.2],'Whey protein (1 scoop, 30 g)':[120,24,3,1.5],'Tapioca (2 col. de goma)':[100,0,25,0],'Pão francês sem miolo (1 un)':[75,2.5,15,.5],'Macarrão cozido (100 g)':[150,5,30,1],'Arroz integral (100 g)':[124,2.6,26,1],'Mandioca cozida (100 g)':[125,.6,30,.3],'Batata inglesa cozida (100 g)':[52,1.2,12,.1],'Brócolis cozido (100 g)':[35,2.4,7,.4],'Cenoura cozida (100 g)':[35,.8,8,.2],'Abobrinha (100 g)':[17,1.2,3,.3],'Mamão (1 fatia média)':[55,.6,14,.1],'Laranja (1 un)':[62,1.2,15,.2],'Morango (100 g)':[32,.7,8,.3],'Abacate (2 col. de sopa)':[80,1,4,7],'Castanhas (30 g)':[190,4,6,18],'Pasta de amendoim (1 col. de sopa)':[95,4,3,8],'Café com leite desnatado (1 xíc.)':[25,2,3,0],'Refrigerante zero (lata)':[0,0,0,0]};
const allFoods=()=>Object.assign({},FOODS,S.cf);
function myFoods(){const k=Object.keys(S.cf);return k.length?`<div class="card"><h2>⭐ Meus alimentos</h2><div class="list">${k.map(n=>{const v=S.cf[n];return`<div><span>${esc(n)}<br><span class="mut">${v[0]} kcal · P ${v[1]} · C ${v[2]} · G ${v[3]}</span></span><button class="x" data-cfdel="${esc(n)}">✕</button></div>`}).join('')}</div></div>`:''}
document.addEventListener('input',e=>{if(e.target.id=='pre')e.target.dispatchEvent(new Event('change',{bubbles:true}))});
const MEALS=['☕ Café da manhã','🥗 Almoço','🍎 Lanche','🌙 Jantar'];
function defs(){const p={nome:'Larissa',idade:36,alt:169,peso0:100,meta:72};return{p,g:goals(p,100),w:[{d:T,v:100}],m:[],bp:[],meds:[],ml:{},f:[],e:[],ag:{}}}
function goals(){return{kcal:1850,p:130,c:210,f:55,agua:2.5}}
let S;try{S=JSON.parse(localStorage.getItem('larissa-v1'))}catch(e){}S=S||defs();if(S.v!=2){S.g=goals();S.v=2;S.tk={};S.ld={}}S.cf=S.cf||{};
const save=()=>{try{localStorage.setItem('larissa-v1',JSON.stringify(S))}catch(e){}};
let tab='hoje',day=T;
const TABS=[['hoje','🌸 Painel'],['dia','🍽️ Diário'],['ex','🏃‍♀️ Exercícios'],['peso','⚖️ Peso'],['med','📏 Medidas'],['pa','❤️ Pressão'],['rem','💊 Remédios'],['plano','🦋 Plano']];
const cur=()=>S.w.length?S.w.slice().sort((a,b)=>a.d<b.d?-1:1).pop().v:S.p.peso0;
const imc=kg=>kg/Math.pow(S.p.alt/100,2);
function chart(pts,goal,unit){if(pts.length<2)return'<p class="mut">Registre ao menos 2 dias para ver o gráfico 🦋</p>';const W=320,H=140,P=24,ys=pts.map(p=>p.y).concat(goal!=null?[goal]:[]),mn=Math.min(...ys)-1,mx=Math.max(...ys)+1;const X=i=>P+i*(W-2*P)/(pts.length-1),Y=v=>H-P-(v-mn)*(H-2*P)/(mx-mn);let d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');return`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>${goal!=null?`<line x1="${P}" x2="${W-P}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#c4b5fd" stroke-dasharray="4"/><text x="${W-P}" y="${Y(goal)-3}" text-anchor="end">meta ${goal}</text>`:''}<path d="${d}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#ec4899"/>${i==0||i==pts.length-1||pts.length<8?`<text x="${X(i)}" y="${Y(p.y)-8}" text-anchor="middle">${n1(p.y)}</text>`:''}<text x="${X(i)}" y="${H-6}" text-anchor="middle">${i%Math.ceil(pts.length/6)==0?p.x:''}</text>`).join('')}</svg>`}
const bar=(l,v,g,u)=>{const pc=Math.min(100,v/g*100);return`<div class="row"><span>${l}</span><span>${n1(v)} / ${n1(g)} ${u}</span></div><div class="bar"><i style="width:${pc}%"></i></div>`};
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const fday=d=>S.f.filter(x=>x.d==d),eday=d=>S.e.filter(x=>x.d==d);
const dateIn=`<input type="date" name="d" value="${T}" required>`;
const pbDay=()=>`<input type="date" id="dayp" value="${day}" style="max-width:170px">`;
function vHoje(){const w=cur(),lost=S.p.peso0-w,tot=S.p.peso0-S.p.meta,pc=Math.max(0,Math.min(100,lost/tot*100)),F=fday(T),E=eday(T),k=sum(F,'k'),b=sum(E,'k'),G=S.g;const pts=S.w.slice().sort((a,b)=>a.d<b.d?-1:1).map(x=>({x:br(x.d),y:x.v}));const ms=S.meds.filter(m=>1),ok=ms.filter(m=>(S.ml[T]||{})[m.id]).length;
return`<div class="card"><h2>Sua jornada 🌷</h2><div class="grid"><div class="kpi"><b>${n1(w)} kg</b><span>peso atual</span></div><div class="kpi"><b>${lost>=0?'−':'+'}${n1(Math.abs(lost))} kg</b><span>desde o início</span></div><div class="kpi"><b>${n1(imc(w))}</b><span>IMC</span></div><div class="kpi"><b>${n1(Math.max(0,w-S.p.meta))} kg</b><span>para a meta de ${S.p.meta} kg</span></div></div><div class="bar" style="height:14px;margin-top:12px"><i style="width:${pc}%"></i></div><div class="mut">${n1(pc)}% do caminho 🦋</div></div>
<div class="card"><h2>Hoje 🌿</h2>${bar('Calorias comidas',k,G.kcal,'kcal')}${bar('Proteínas',sum(F,'p'),G.p,'g')}${bar('Carboidratos',sum(F,'c'),G.c,'g')}${bar('Gorduras',sum(F,'f'),G.f,'g')}<div class="row"><span>🔥 Gasto em exercícios: <b>${Math.round(b)} kcal</b></span><span>Saldo: <b>${Math.round(G.kcal-k+b)} kcal</b></span></div><div class="row" style="margin-top:6px"><span>💧 Água: ${n1(S.ag[T]||0)} / ${G.agua} L</span><button class="btn" data-ag="0.25">+250 ml</button></div><div class="row" style="margin-top:6px"><span>💊 Remédios: ${ok}/${ms.length}</span></div></div>
<div class="card"><h2>Evolução do peso</h2>${chart(pts,S.p.meta)}</div>`}
function vDia(){const F=fday(day),G=S.g;return`<div class="card"><h2>Diário alimentar</h2>${pbDay()}<div style="margin-top:10px">${bar('Calorias',sum(F,'k'),G.kcal,'kcal')}${bar('Proteínas',sum(F,'p'),G.p,'g')}${bar('Carboidratos',sum(F,'c'),G.c,'g')}${bar('Gorduras',sum(F,'f'),G.f,'g')}</div></div>
${MEALS.map((m,mi)=>`<div class="card"><h2>${m} <span class="mut">${Math.round(sum(F.filter(x=>x.m==mi),'k'))} kcal</span></h2><div class="list">${F.map((x,i)=>[x,i]).filter(([x])=>x.m==mi).map(([x])=>`<div><span>${esc(x.n)}<br><span class="mut">P ${n1(x.p)} · C ${n1(x.c)} · G ${n1(x.f)}</span></span><span>${Math.round(x.k)} kcal <button class="x" data-del="f:${x.id}">✕</button></span></div>`).join('')||'<span class="mut">Nada registrado</span>'}</div></div>`).join('')}
<div class="card"><h2>✨ Cardápio sugerido (~1.850 kcal)</h2><p class="mut">Adiciona as 4 refeições do plano neste dia; depois ajuste o que mudar.</p><button class="btn" data-cardapio="1">Usar cardápio no dia</button></div>${myFoods()}<div class="card"><h2>📋 Lançamento rápido</h2><p class="mut">Cole uma linha por alimento: refeição (1 café, 2 almoço, 3 lanche, 4 jantar) | nome | kcal | prot | carb | gord</p><form data-f="lote" style="grid-template-columns:1fr"><textarea name="t" rows="6" placeholder="1 | Pão francês | 150 | 4 | 29,3 | 1,5" required style="width:100%;padding:9px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit"></textarea><button class="btn">Lançar no dia</button></form></div><div class="card"><h2>➕ Adicionar alimento</h2><input id="pre" list="fl" placeholder="🔍 Buscar alimento (digite o nome)" autocomplete="off"><datalist id="fl">${Object.keys(allFoods()).map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
<form data-f="food"><select name="m">${MEALS.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select><input name="n" placeholder="Alimento e porção" required><label class="mut">Calorias (kcal)<input name="k" type="number" step="any" required></label><label class="mut">Proteína (g)<input name="p" type="number" step="any"></label><label class="mut">Carboidrato (g)<input name="c" type="number" step="any"></label><label class="mut">Gordura (g)<input name="f" type="number" step="any"></label><label class="mut">Quantidade (porções)<input name="q" type="number" step="any" value="1"></label><label class="chk mut"><input type="checkbox" name="sv" style="width:20px;height:20px"> Salvar na minha lista</label><button class="btn">Adicionar</button></form><p class="mut">Informe os valores de uma porção; a quantidade multiplica tudo. Marcando “Salvar na minha lista”, o alimento passa a aparecer na busca.</p></div>`}
function vEx(){const E=eday(day),w=cur(),wk=S.e.filter(x=>x.d>=iso(new Date(Date.now()-6*864e5)));return`<div class="card"><h2>Exercícios</h2>${pbDay()}<div class="grid" style="margin-top:10px"><div class="kpi"><b>${Math.round(sum(E,'k'))}</b><span>kcal queimadas no dia</span></div><div class="kpi"><b>${sum(E,'t')} min</b><span>tempo no dia</span></div><div class="kpi"><b>${Math.round(sum(wk,'k'))}</b><span>kcal em 7 dias</span></div><div class="kpi"><b>${Math.round(sum(S.e,'k'))}</b><span>kcal no total</span></div></div><div class="list" style="margin-top:8px">${E.map(x=>`<div><span>${esc(x.n)} · ${x.t} min</span><span>${Math.round(x.k)} kcal <button class="x" data-del="e:${x.id}">✕</button></span></div>`).join('')||'<span class="mut">Nenhum exercício neste dia</span>'}</div></div>
${treino()}<div class="card"><h2>➕ Registrar atividade</h2><form data-f="ex"><select name="n">${Object.keys(ACT).map(k=>`<option>${k}</option>`).join('')}</select><input name="t" type="number" placeholder="Minutos" required><input name="k" type="number" placeholder="kcal (opcional)"><button class="btn">Salvar</button></form><p class="mut">Sem informar kcal, calculamos pelo seu peso atual (${n1(w)} kg).</p></div>`}
function vPeso(){const W=S.w.slice().sort((a,b)=>a.d<b.d?-1:1);return`<div class="card"><h2>Peso e evolução</h2>${chart(W.map(x=>({x:br(x.d),y:x.v})),S.p.meta)}<form data-f="peso">${dateIn}<input name="v" type="number" step="0.1" placeholder="Peso (kg)" required><button class="btn">Registrar</button></form></div><div class="card"><h2>Histórico</h2><div class="list">${W.slice().reverse().map((x,i,a)=>{const pr=a[i+1],df=pr?x.v-pr.v:0;return`<div><span>${br(x.d)}/${x.d.slice(0,4)}</span><span><b>${n1(x.v)} kg</b> ${pr?`<span class="tag" style="background:${df<=0?'var(--ok)':'var(--warn)'}">${df>0?'+':''}${n1(df)}</span>`:''} <button class="x" data-del="w:${x.d}">✕</button></span></div>`}).join('')}</div></div>`}
const MD=[['cintura','Cintura'],['quadril','Quadril'],['busto','Busto'],['braco','Braço'],['coxa','Coxa'],['pescoco','Pescoço']];
function vMed(){const M=S.m.slice().sort((a,b)=>a.d<b.d?-1:1),a=M[0],z=M[M.length-1];return`<div class="card"><h2>Medidas corporais (cm)</h2><form data-f="med">${dateIn}${MD.map(([k,l])=>`<input name="${k}" type="number" step="0.1" placeholder="${l}">`).join('')}<button class="btn">Salvar</button></form></div>
${M.length>1?`<div class="card"><h2>Evolução 🌿</h2><div class="list">${MD.filter(([k])=>a[k]&&z[k]).map(([k,l])=>`<div><span>${l}</span><span>${a[k]} → <b>${z[k]}</b> <span class="tag" style="background:${z[k]<=a[k]?'var(--ok)':'var(--warn)'}">${n1(z[k]-a[k])} cm</span></span></div>`).join('')}</div></div>`:''}
<div class="card"><h2>Histórico</h2><div class="tbl"><table><tr><th>Data</th>${MD.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${M.slice().reverse().map(x=>`<tr><td>${br(x.d)}</td>${MD.map(([k])=>`<td>${x[k]||'–'}</td>`).join('')}<td><button class="x" data-del="m:${x.id}">✕</button></td></tr>`).join('')}</table></div></div>`}
function cls(s,d){return s<120&&d<80?['Ótima','var(--ok)']:s<130&&d<85?['Normal','var(--ok)']:s<140&&d<90?['Limítrofe','var(--warn)']:['Alta · fale com seu médico','var(--bad)']}
function vPA(){const B=S.bp.slice().sort((a,b)=>(a.d+a.h)<(b.d+b.h)?-1:1);return`<div class="card"><h2>Pressão arterial</h2>${chart(B.slice(-14).map(x=>({x:br(x.d),y:x.s})),null)}<p class="mut">Gráfico da sistólica (máxima), últimos 14 registros.</p><form data-f="pa">${dateIn}<input name="h" type="time" value="08:00"><input name="s" type="number" placeholder="Máxima (12 = 120)" required><input name="di" type="number" placeholder="Mínima" required><input name="pl" type="number" placeholder="Pulso"><button class="btn">Registrar</button></form></div><div class="card"><h2>Histórico</h2><div class="list">${B.slice().reverse().map(x=>{const c=cls(x.s,x.di);return`<div><span>${br(x.d)} ${x.h}</span><span><b>${x.s}/${x.di}</b> ${x.pl?'· ❤ '+x.pl:''} <span class="tag" style="background:${c[1]}">${c[0]}</span> <button class="x" data-del="bp:${x.id}">✕</button></span></div>`}).join('')}</div></div>`}
function vRem(){const L=S.ml[day]||{};return`<div class="card"><h2>Remédios do dia</h2>${pbDay()}${S.meds.map(m=>`<label class="chk"><input type="checkbox" data-mk="${m.id}" ${L[m.id]?'checked':''}><span><b>${esc(m.n)}</b> ${esc(m.dose)} <span class="mut">· ${esc(m.h)}</span></span><button class="x" data-del="meds:${m.id}" style="margin-left:auto">✕</button></label>`).join('')||'<p class="mut">Cadastre seus remédios abaixo.</p>'}</div><div class="card"><h2>➕ Novo remédio</h2><form data-f="rem"><input name="n" placeholder="Nome" required><input name="dose" placeholder="Dose (ex.: 1 comp.)"><input name="h" placeholder="Horário (ex.: 08:00)"><button class="btn">Adicionar</button></form></div>`}
function vPlano(){const G=S.g,p=S.p,w=cur();return`<div class="card"><h2>🌸 Seu plano ideal</h2><p>Ponto de partida: <b>1.800 a 1.950 kcal/dia</b> com <b>115 a 140 g de proteína</b> e treino <b>Full Body 3x por semana</b> (seg · qua · sex, ou ter · qui · sáb). O déficit fica em torno de 400 a 500 kcal, o que sustenta de <b>0,4 a 0,8 kg por semana</b>, rumo a ${p.meta} kg. Hoje: <b>${n1(w)} kg</b>, IMC <b>${n1(imc(w))}</b>.</p><div class="grid"><div class="kpi"><b>${G.kcal}</b><span>kcal/dia</span></div><div class="kpi"><b>${G.p} g</b><span>proteína</span></div><div class="kpi"><b>${G.c} g</b><span>carboidrato</span></div><div class="kpi"><b>${G.f} g</b><span>gordura</span></div></div><p class="mut">Nunca fique abaixo de 1.650 kcal, perto do seu gasto basal. Meta de proteína: 30 a 35 g por refeição; um scoop de whey no lanche ajuda a bater. Ajuste os valores abaixo, em Ajustar perfil e metas.</p></div>
<div class="card"><h2>🍽️ Rotina diária</h2><ul class="pl"><li>Registre cada refeição logo após comer (leva 1 minuto)</li><li>Proteína de 30 a 35 g em cada refeição (ovos, frango, peixe, iogurte, whey)</li><li>Troque frituras por assado ou airfryer; bebidas açucaradas por água, chá gelado sem açúcar ou refrigerante zero</li><li>Evite molhos prontos (maionese, rosé); use mostarda, limão, vinagre, alho, cebola, páprica e ervas</li><li>Pese os alimentos prontos nas 2 primeiras semanas para aprender as porções</li><li>Metade do prato de legumes e folhas</li><li>Água: ${G.agua} L por dia · sono de 7 a 8 h</li><li>Pese-se 1 a 2 vezes por semana, sempre em jejum, e olhe a tendência, não o dia</li></ul></div>
<div class="card"><h2>🏋️‍♀️ Treino e cardio</h2><ul class="pl"><li><b>Full Body 3x/semana</b> em dias alternados, com 7 exercícios em máquinas, que protegem joelhos e lombar. A ficha com checklist está na aba Exercícios</li><li><b>Séries:</b> 3 de 10 a 12 repetições, descanso de 60 a 90 s, últimas 2 repetições difíceis mas com boa postura (2 RIR)</li><li><b>Cardio pós-treino:</b> 20 a 30 min de bicicleta ou elíptico, em ritmo em que ainda dá para conversar</li><li><b>Semanas 1 e 2:</b> cargas leves a moderadas. Dor muscular tardia é normal; pare se sentir fisgadas nos joelhos, ombros ou lombar</li><li><b>Da semana 3:</b> faça 12 repetições em todas as séries com boa forma antes de subir um pino de carga</li></ul></div><div class="card"><h2>🍽️ Cardápio sugerido (~1.850 kcal · ~130 g prot.)</h2><ul class="pl"><li><b>Café (~410 kcal · 28 g):</b> 3 ovos mexidos com um fio de azeite, 2 fatias de pão integral, mamão ou banana pequena, café sem açúcar</li><li><b>Almoço (~560 kcal · 42 g):</b> 130 g de frango, patinho ou tilápia, 4 col. de sopa de arroz (100 g), 1 concha de feijão (80 g), salada à vontade e legumes com 1 col. de chá de azeite</li><li><b>Lanche (~360 kcal · 26 g):</b> iogurte natural 170 g + 1 scoop (30 g) de whey + 1 col. de aveia; ou tapioca com 100 g de frango desfiado (ou cottage) + maçã</li><li><b>Jantar (~520 kcal · 34 g):</b> 120 g de carne magra ou frango, ou omelete de 2 ovos + 2 claras, 120 g de batata, batata-doce ou mandioca, legumes com 1 col. de chá de azeite</li><li><b>Trocas:</b> arroz, batata, macarrão e mandioca valem na mesma quantidade em gramas; as carnes podem variar entre frango, peixe, lombo suíno e cortes bovinos magros</li></ul><p class="mut">Na aba Diário, o botão “Usar cardápio no dia” lança essas refeições de uma vez.</p></div>
<div class="card"><h2>📋 O que registrar</h2><ul class="pl"><li><b>Todo dia:</b> comida, água, exercício, remédios</li><li><b>Semanal:</b> peso</li><li><b>A cada 2 semanas:</b> medidas (cintura, quadril, busto, braço, coxa)</li><li><b>Pressão:</b> conforme orientação médica; mínimo 2 a 3 vezes por semana, em repouso</li></ul></div>
<div class="card"><h2>⚙️ Ajustar perfil e metas</h2><form data-f="cfg"><input name="nome" value="${esc(p.nome)}" title="Nome"><input name="idade" type="number" value="${p.idade}" title="Idade"><input name="alt" type="number" value="${p.alt}" title="Altura cm"><input name="peso0" type="number" step="0.1" value="${p.peso0}" title="Peso inicial"><input name="meta" type="number" step="0.1" value="${p.meta}" title="Meta kg"><input name="kcal" type="number" value="${G.kcal}" title="kcal"><input name="gp" type="number" value="${G.p}" title="Proteína"><input name="gc" type="number" value="${G.c}" title="Carbo"><input name="gf" type="number" value="${G.f}" title="Gordura"><button class="btn">Salvar</button></form><p class="mut">Campos: nome, idade, altura (cm), peso inicial, meta (kg), kcal, proteína, carbo, gordura.</p></div>
<div class="card"><h2>🩺 Cuidado</h2><p class="mut">Antes de iniciar dieta e exercícios, converse com seu médico, principalmente se usa medicação ou tem pressão alta. Pressão acima de 140/90 repetidamente, tontura, dor no peito ou falta de ar: procure atendimento.</p></div>`}
const FICHA=[['Leg Press 45° ou horizontal','Pés na largura dos ombros; não trave os joelhos no topo.'],['Puxada frontal na polia','Barra até a parte alta do peito; ombros longe das orelhas.'],['Mesa ou cadeira flexora','Volta do peso lenta e controlada.'],['Supino na máquina (chest press)','Cotovelos levemente abaixo da linha dos ombros; pés firmes.'],['Elevação pélvica','Contraia os glúteos no topo, sem arquear a lombar.'],['Desenvolvimento de ombros na máquina','Costas totalmente apoiadas no encosto.'],['Prancha abdominal','3 séries de 20 a 30 s, contraindo abdômen e glúteos.']];
const CARD=[['3 ovos mexidos + 2 fatias de pão integral + mamão + café',410,28,30,20],['130 g de frango grelhado + arroz (100 g) + feijão (80 g) + salada e legumes',560,42,66,14],['Iogurte natural 170 g + 1 scoop de whey + 1 col. de aveia',360,26,50,6],['120 g de carne magra + 120 g de batata + legumes',520,34,60,16]];
function treino(){const L=S.tk[day]||{},dn=FICHA.filter((_,i)=>L[i]).length;return`<div class="card"><h2>🏋️‍♀️ Treino Full Body <span class="mut">${dn}/7</span></h2><p class="mut">Seg · Qua · Sex. 3 séries de 10 a 12 repetições, descanso de 60 a 90 s, parando com 2 repetições sobrando (2 RIR). Depois, 20 a 30 min de bicicleta ou elíptico em ritmo moderado.</p>${FICHA.map((x,i)=>`<label class="chk"><input type="checkbox" data-tk="${i}" ${L[i]?'checked':''}><span><b>${x[0]}</b><br><span class="mut">${x[1]}</span></span><input type="text" data-ld="${i}" value="${esc(S.ld[i]||'')}" placeholder="carga" style="width:78px;margin-left:auto"></label>`).join('')}</div>`}
const V={hoje:vHoje,dia:vDia,ex:vEx,peso:vPeso,med:vMed,pa:vPA,rem:vRem,plano:vPlano};
function render(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-t="${k}">${l}</button>`).join('');$('#view').innerHTML=V[tab]();$('#hello').textContent='Olá, '+S.p.nome+'! Cada passo conta 🌸'}
const id=()=>Date.now()+Math.random().toString(36).slice(2,5);
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-del],[data-ag],[data-cardapio],[data-cfdel]');if(!t)return;if(t.dataset.cfdel){delete S.cf[t.dataset.cfdel];save();render()}else if(t.dataset.cardapio){CARD.forEach((c,m)=>S.f.push({id:id(),d:day,m,n:c[0],k:c[1],p:c[2],c:c[3],f:c[4]}));save();render()}else if(t.dataset.t){tab=t.dataset.t;render();scrollTo(0,0)}else if(t.dataset.ag){S.ag[T]=(S.ag[T]||0)+ +t.dataset.ag;save();render()}else{const[a,k]=t.dataset.del.split(':');S[a]=S[a].filter(x=>String(x.id||x.d)!=k);save();render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='dayp'){day=t.value||T;render()}else if(t.id=='pre'){const v=allFoods()[t.value];if(!v)return;const f=t.parentNode.querySelector('form');f.n.value=t.value;f.k.value=v[0];f.p.value=v[1];f.c.value=v[2];f.f.value=v[3];f.q.value=1}else if(t.dataset.mk){(S.ml[day]=S.ml[day]||{})[t.dataset.mk]=t.checked;save()}else if(t.dataset.tk!==undefined){(S.tk[day]=S.tk[day]||{})[t.dataset.tk]=t.checked;save();render()}else if(t.dataset.ld!==undefined){S.ld[t.dataset.ld]=t.value;save()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f,o=Object.fromEntries(new FormData(f)),N=x=>+x||0;
if(k=='food'){const q=N(o.q)||1;if(o.sv)S.cf[o.n]=[N(o.k),N(o.p),N(o.c),N(o.f)];S.f.push({id:id(),d:day,m:+o.m,n:o.n+(q!=1?' ×'+q:''),k:N(o.k)*q,p:N(o.p)*q,c:N(o.c)*q,f:N(o.f)*q})}
else if(k=='lote'){o.t.split('\n').forEach(l=>{const a=l.split('|').map(s=>s.trim());if(a.length<3)return;const P=x=>parseFloat(String(x||'0').replace(',','.'))||0;S.f.push({id:id(),d:day,m:Math.min(3,Math.max(0,(parseInt(a[0])||1)-1)),n:a[1],k:P(a[2]),p:P(a[3]),c:P(a[4]),f:P(a[5])})})}else if(k=='ex'){const t=N(o.t);S.e.push({id:id(),d:day,n:o.n,t,k:N(o.k)||Math.round(ACT[o.n]*cur()*t/60)})}
else if(k=='peso'){S.w=S.w.filter(x=>x.d!=o.d);S.w.push({d:o.d,v:N(o.v)})}
else if(k=='med'){const r={id:id(),d:o.d};MD.forEach(([a])=>{if(o[a])r[a]=N(o[a])});S.m.push(r)}
else if(k=='pa'){S.bp.push({id:id(),d:o.d,h:o.h,s:N(o.s),di:N(o.di),pl:N(o.pl)})}
else if(k=='rem'){S.meds.push({id:id(),n:o.n,dose:o.dose,h:o.h})}
else if(k=='cfg'){S.p={nome:o.nome||'Larissa',idade:N(o.idade),alt:N(o.alt),peso0:N(o.peso0),meta:N(o.meta)};S.g={kcal:N(o.kcal),p:N(o.gp),c:N(o.gc),f:N(o.gf),agua:S.g.agua}}
save();render()});
render();
</script>
</body>
</html>
